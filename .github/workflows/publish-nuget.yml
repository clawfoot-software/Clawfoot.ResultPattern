name: Publish to NuGet

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'New package version (must be greater than current; e.g. 2.1.1)'
        required: true
        type: string

permissions:
  contents: write  # required to push version bump commit and tag
  id-token: write  # required for NuGet trusted publishing (GitHub OIDC token)

env:
  PROJECT_PATH: Clawfoot.Result/Clawfoot.ResultPattern.csproj

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get current version
        id: current
        run: |
          CURRENT=$(grep -oP '<Version>\K[^<]+' ${{ env.PROJECT_PATH }})
          echo "current=$CURRENT" >> $GITHUB_OUTPUT
          echo "Current version: $CURRENT"

      - name: Validate version (no downgrade)
        run: |
          CURRENT="${{ steps.current.outputs.current }}"
          NEW="${{ inputs.version }}"
          if [ -z "$CURRENT" ] || [ -z "$NEW" ]; then
            echo "::error::Could not read current or new version."
            exit 1
          fi
          HIGHER=$(printf '%s\n' "$CURRENT" "$NEW" | sort -V -r | head -1)
          if [ "$HIGHER" != "$NEW" ] || [ "$CURRENT" = "$NEW" ]; then
            echo "::error::Version $NEW is not greater than current $CURRENT. You cannot downgrade or reuse the same version."
            exit 1
          fi
          echo "Version $NEW is valid (greater than $CURRENT)."

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore ${{ env.PROJECT_PATH }}

      - name: Test
        run: dotnet test Clawfoot.ResultPattern.sln --configuration Release

      - name: Build
        run: |
          dotnet build ${{ env.PROJECT_PATH }} --configuration Release --no-restore -p:Version=${{ inputs.version }}

      - name: Pack (package + symbols)
        run: |
          mkdir -p ./out
          dotnet pack ${{ env.PROJECT_PATH }} \
            --configuration Release \
            --no-build \
            --output ./out \
            -p:Version=${{ inputs.version }}

      # Temporary API key is valid for 1 hour, so request it right before pushing
      - name: NuGet login (OIDC -> temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}  # nuget.org profile name, NOT email

      - name: Push package to NuGet
        run: |
          dotnet nuget push ./out/*.nupkg \
            --api-key ${{ steps.login.outputs.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: Push symbol package to NuGet
        run: |
          dotnet nuget push ./out/*.snupkg \
            --api-key ${{ steps.login.outputs.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: Update version in csproj
        run: |
          # AssemblyVersion/FileVersion are not set in the csproj; they derive from Version
          sed -i "s/<Version>.*<\/Version>/<Version>${{ inputs.version }}<\/Version>/" ${{ env.PROJECT_PATH }}

      - name: Commit version bump and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ${{ env.PROJECT_PATH }}
          git commit -m "Bump version to ${{ inputs.version }}"
          git tag "v${{ inputs.version }}"
          git push origin HEAD
          git push origin "v${{ inputs.version }}"
